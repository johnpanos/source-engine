name: Capability composition
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install test dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ pkg-config libbz2-dev zlib1g-dev
        python -m pip install -r tools/quality/requirements-ci.txt
    - name: Test gate sensitivity and architecture
      run: |
        python3 -m unittest discover -s tools/quality/tests -v
        python3 -m unittest discover -s tools/archlint/tests -v
        python3 tools/archlint/archlint.py check --all
    - name: Required composition outcomes in release mode
      run: |
        python3 tools/quality/conformance.py check --suite platform.composition --suite foundation.expected --suite foundation.expected.bad-access --suite foundation.expected.ignored --suite platform.test-runner
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: composition-evidence
        path: quality-results/
