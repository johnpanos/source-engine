name: Source style

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned formatter
        run: python -m pip install -r tools/stylelint/requirements.txt
      - name: Test style checker and negative fixtures
        run: python -m unittest discover -s tools/stylelint/tests -v
      - name: Check changed Source code
        env:
          STYLE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$STYLE_BASE" = "0000000000000000000000000000000000000000" ]; then
            python tools/stylelint/stylelint.py --all --diff
          else
            python tools/stylelint/stylelint.py --changed --base "$STYLE_BASE" --diff
          fi
