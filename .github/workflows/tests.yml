name: Tests

on: [push, pull_request]

jobs:
  architecture:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Verify RFC 0001 architecture baseline
      run: |
        python3 tools/archlint/archlint.py check --all
        python3 tools/archlint/archlint.py baseline --verify
        python3 tools/archlint/archlint.py inventory --verify
    - name: Verify RFC 0002 Hammer migration schema and ratchet
      if: always()
      run: |
        python3 tools/archlint/archlint.py hammer --verify
    - name: Run RFC 0002 Hammer headless strict-module suites
      if: always()
      run: |
        unittests/hammertest/run_headless.sh
    - name: Run architecture unit tests
      if: always()
      run: |
        python3 -m unittest discover -s tools/archlint/tests -v

  tests-linux-i386:
    runs-on: ubuntu-20.04

    steps:
    - uses: actions/checkout@v2
    - name: Run tests linux-i386
      run: |
        scripts/tests-ubuntu-i386.sh

  tests-linux-amd64:
    runs-on: ubuntu-20.04

    steps:
    - uses: actions/checkout@v2
    - name: Run tests linux-amd64
      run: |
        scripts/tests-ubuntu-amd64.sh

  tests-macos-amd64:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v2
    - name: Run tests macos-amd64
      run: |
        scripts/tests-macos-amd64.sh

  tests-windows-i386:
    runs-on: windows-2019

    steps:
    - uses: actions/checkout@v2
    - name: Run tests windows-i386
      run: |
        git submodule init && git submodule update
        ./waf.bat configure -T release --tests --prefix=out/ --32bits
        ./waf.bat install
        cd out
        $env:Path = "bin";
        ./unittest.exe

  tests-windows-amd64:
    runs-on: windows-2019

    steps:
    - uses: actions/checkout@v2
    - name: Run tests windows-amd64
      run: |
        git submodule init && git submodule update
        ./waf.bat configure -T release --tests --prefix=out/
        ./waf.bat install
        cd out
        $env:Path = "bin";
        ./unittest.exe
