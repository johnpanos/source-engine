name: Tests

on: [push, pull_request]

jobs:
  architecture:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Verify RFC 0001 architecture baseline
      run: |
        python3 tools/archlint/archlint.py check --all
        python3 tools/archlint/archlint.py baseline --verify
        python3 tools/archlint/archlint.py inventory --verify
    - name: Verify RFC 0002 Hammer migration schema and ratchet
      if: always()
      run: |
        python3 tools/archlint/archlint.py hammer --verify
    - name: Run RFC 0002 Hammer headless strict-module suites
      if: always()
      run: |
        unittests/hammertest/run_headless.sh
    - name: Run architecture unit tests
      if: always()
      run: |
        python3 -m unittest discover -s tools/archlint/tests -v

  hammer-windows-parity:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Install MinGW-w64 and Wine
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y g++-mingw-w64-x86-64 wine64 wine
    - name: RFC 0002 strict-core Windows PE parity under Wine
      env:
        WINEDEBUG: "-all"
        WINEDLLOVERRIDES: "mscoree,mshtml="
      run: |
        # Prove the MFC-free editor core behaves identically on the Windows target.
        python3 tools/quality/parity_wine.py check --cxx x86_64-w64-mingw32-g++-posix --wrapper wine

  tests-linux-i386:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v2
    - name: Run tests linux-i386
      run: |
        scripts/tests-ubuntu-i386.sh

  tests-linux-amd64:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v2
    - name: Run tests linux-amd64
      run: |
        scripts/tests-ubuntu-amd64.sh

  tests-macos-amd64:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v2
    - name: Run tests macos-amd64
      run: |
        scripts/tests-macos-amd64.sh

  tests-windows-i386:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v2
    - name: Run tests windows-i386
      run: |
        git submodule init && git submodule update
        ./waf.bat configure -T release --tests --prefix=out/ --32bits
        ./waf.bat install
        cd out
        $env:Path = "bin";
        ./unittest.exe
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        ./unittest_legacy.exe

  tests-windows-amd64:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v2
    - name: Run tests windows-amd64
      run: |
        git submodule init && git submodule update
        ./waf.bat configure -T release --tests --prefix=out/
        ./waf.bat install
        cd out
        $env:Path = "bin";
        ./unittest.exe
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        ./unittest_legacy.exe
