name: Conformance
# RFC 0005 Q1 / roadmap R02: the shared conformance runner over every suite in
# quality/conformance.manifest.json. The runner self-tests prove outcome
# handling first; the matrix then runs the full manifest under both compilers in
# the default and optimized NDEBUG configurations. Every job uploads its
# conformance-evidence/v2 JSON and per-suite build/run logs, including failures.
on: [push, pull_request]
jobs:
  runner-self-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Runner outcome handling (negative fixtures)
      run: python3 -m unittest tools/quality/tests/test_conformance.py -v
    - name: BSP2 independent reader and negative fixtures
      run: python3 -m unittest tools/quality/tests/test_bsp2_reader.py -v
    - name: BSP2 server oracle and negative fixtures
      run: python3 -m unittest tools/quality/tests/test_bsp2_server_compare.py -v
    - name: BSP2 client and dedicated runner input gates
      run: python3 -m unittest tools/quality/tests/test_bsp2_dedicated.py -v
    - name: BSP2 v19 derivative boundary
      run: python3 -m unittest tools/quality/tests/test_bsp2_v19_derivative.py -v
    - name: BSP2 F1 native gate required inputs
      run: python3 -m unittest tools/quality/tests/test_bsp2_f1_gate.py -v
    - name: BSP2 sparse export input and output rules
      run: python3 -m unittest tools/quality/tests/test_bsp2_sparse_export.py -v
    - name: Portal runtime staging rules
      run: python3 -m unittest tools/quality/tests/test_portal_boot.py -v
    - name: Physics benchmark gate rules (RFC 0013)
      run: python3 -m unittest tools/quality/tests/test_physics_bench.py -v
    - name: Game collision-filter audit negative fixtures (RFC 0013 P3)
      run: python3 -m unittest tools/quality/tests/test_physics_filter_audit.py -v
    - name: Game collision filters stay safe on physics worker threads (RFC 0013 P3)
      run: python3 tools/quality/physics_filter_audit.py check
    - name: SDF GI performance fixture rules (RFC 0011 G6)
      run: python3 -m unittest tools/quality/tests/test_gi_sdf_bench.py -v
    - name: SDF GI performance fixtures declaration (RFC 0011 G6)
      run: python3 tools/quality/gi_sdf_bench.py validate

  headless-manifest:
    needs: runner-self-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
        config: [default, release]
    steps:
    - uses: actions/checkout@v4
    - name: Enumerate selected suites and providers
      run: python3 tools/quality/conformance.py plan
    - name: Build, run and evidence every manifest suite
      run: >
        python3 tools/quality/conformance.py check
        --cxx ${{ matrix.cxx }} --config ${{ matrix.config }}
        --out quality-results/conformance-${{ matrix.cxx }}-${{ matrix.config }}.json
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: conformance-${{ matrix.cxx }}-${{ matrix.config }}
        path: quality-results/
        if-no-files-found: error
