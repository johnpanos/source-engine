name: C++ toolchain boundary

on: [push, pull_request]

jobs:
  linux-targets:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ clang pkg-config cmake ninja-build libbz2-dev zlib1g-dev
      # RFC 0016 K4: the test composition embeds SPIR-V built with the pinned
      # shader tools.
      - name: Build the pinned shader tools
        run: python3 tools/render/shader_toolchain.py build
      - name: Check boundary sensitivity
        run: python3 -m unittest tools/quality/tests/test_toolchain_boundary.py -v
      # kiln profiles ci-toolchain-linux and ci-toolchain-linux-clang pin the
      # runner's GCC and Clang (RFC 0027 L1).
      - name: Build the real test composition (kiln)
        run: ./kiln build ci-toolchain-linux${{ matrix.compiler == 'clang' && '-clang' || '' }}
      - name: Verify final commands and frozen consumers
        run: |
          tree=out/ci-toolchain-linux${{ matrix.compiler == 'clang' && '-clang' || '' }}/dev/build
          python3 tools/quality/toolchain_boundary.py check \
            "$tree/toolchain-invocations.json" --artifacts "$tree" \
            --out quality-results/r03-${{ matrix.compiler }}.json
      - name: Exercise mixed ABI contracts and negative controls
        run: |
          if [ "${{ matrix.compiler }}" = clang ]; then CXX=clang++; else CXX=g++; fi
          python3 tools/quality/conformance.py check --cxx "$CXX" \
            --suite toolchain.abi.jobsystem-batch \
            --suite toolchain.abi.mapcontainer \
            --suite toolchain.abi.sensitivity-dialect-layout \
            --suite toolchain.abi.sensitivity-dual-abi \
            --out quality-results/r03-abi-${{ matrix.compiler }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r03-${{ matrix.compiler }}
          path: |
            out/ci-toolchain-linux*/dev/build/toolchain-invocations.json
            quality-results/
          if-no-files-found: warn
