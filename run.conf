# run.conf — configuration for ./run.sh (the Portal dev launcher).
# Plain key=value. Every value here can also be overridden by an env var of the
# same name, e.g.  MAP=testchmb_a_02 ./run.sh
# Anything you pass on the command line is appended to the game, e.g.
#   ./run.sh -console +sv_cheats 1

# ---- Game ----------------------------------------------------------------
MAP=testchmb_a_01
WIDTH=1920
HEIGHT=1080
WINDOWED=1                 # 1 = -windowed, 0 = fullscreen
FPS_MAX=120

# Renderer provider id (must match a linked backend's id):
#   vulkan-compat  shaderapidx9 -> D3D9 -> DXVK Native -> Vulkan  (stable)
#   native-vulkan  shaderapivulkan native backend            (WIP, partial)
#   null           no rendering
RENDERER=vulkan-compat

# Physics module name (engine turns this into <name>.so):
#   vphysics_box3d   Box3D backend (RFC 0004; default, passes the shared VPhysics
#                    conformance suite against IVP)
#   vphysics         stock IVP (the reference; PHYSICS=vphysics ./play)
PHYSICS=vphysics_box3d

# Extra args always appended to the command line (space separated).
EXTRA_ARGS="-novid -insecure +mat_queue_mode 0"

# ---- Build / staging (advanced) -----------------------------------------
BUILD=1                    # 1 = `waf build` (incremental) before launch, 0 = skip
BUILD_DIR=build            # Waf output tree to boot from
RUNTIME=run/runtime        # staged, runnable tree (seeded once, re-overlaid each run)
# BASE_RUNTIME=            # runtime with Portal content; auto-detected if empty

# ---- Display environment -------------------------------------------------
SDL_VIDEODRIVER=wayland    # wayland | x11
