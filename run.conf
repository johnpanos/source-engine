# run.conf — configuration for ./run.sh (the Portal dev launcher).
# Plain key=value. Every value here can also be overridden by an env var of the
# same name, e.g.  MAP=testchmb_a_02 ./run.sh
# Anything you pass on the command line is appended to the game, e.g.
#   ./run.sh -console +sv_cheats 1

# ---- Game ----------------------------------------------------------------
MAP=testchmb_a_01
WIDTH=1920
HEIGHT=1080
WINDOWED=1                 # 1 = -windowed, 0 = fullscreen
FPS_MAX=120

# Renderer provider id (must match a linked backend's id):
#   native-vulkan  shaderapivulkan native backend with the current PBR direct
#                  pipeline slice (PBR VMT materials are not wired into maps yet)
#   vulkan-compat  shaderapidx9 -> D3D9 -> DXVK Native -> Vulkan
#   null           no rendering
RENDERER=native-vulkan

# Physics module name (engine turns this into <name>.so):
#   vphysics_box3d   Box3D backend (RFC 0004; default, passes the shared VPhysics
#                    conformance suite against IVP)
#   vphysics         stock IVP (the reference; PHYSICS=vphysics ./play)
PHYSICS=vphysics_box3d

# Physics launch flags. -physics_shape_inertia (RFC 0013
# vphysics.shape-inertia.v1, user decision 2026-09-25) gives props the full
# inertia tensor of their collision shape (products of inertia, no
# rotInertiaLimit), so they tumble and precess as solids do; the provider must
# offer it (Box3D does; IVP ignores the flag and keeps its legacy inertia).
# PHYSICS_ARGS= ./play rolls back to the legacy model.
PHYSICS_ARGS=-physics_shape_inertia

# Job system (RFC 0003). The engine already defaults the host frame to the
# ordered serial graph (host_frame_graph 1) and the particle, bone, renderable
# and entity-packing cohorts to the pooled graph (*_job_graph 2). JOB_ARGS turns
# on the pooled paths that default off (oracle-proven equivalent to legacy):
#   cl_render_start_graph    2 = declared render-start graph on the pool
#                                (owns the particle and bone batches)
#   sv_querycache_job_graph  2 = pooled query-cache maintenance
#   portal_carve_job_graph   2 = pooled portal placement carving
#   -vkemitparallel 1          = native Vulkan converts large draws' vertices on
#                                the engine pool (R32-EMIT-PARALLEL, 2026-09-25:
#                                frame median 0.70-0.78x in both queue modes;
#                                byte-verified). Desktop only; Android stays off
#                                until measured on the Fold7.
# host_thread_mode stays 0 (2026-09-25): threading the listen server saves at
# most the server tick (0.35 ms/frame here) and adds a frame of movement lag
# (single-player doesn't predict the player). Its earlier 2.5 ms gain didn't
# reproduce; see RFC/0003-scheduler-nodes-progress.md section 6.
# 0 is the legacy rollback for each, e.g. JOB_ARGS= ./run.sh. Keep it short:
# the engine rejects command lines over 512 characters. The compute pool keeps
# its default size (3 workers here): Box3D's parallel step peaks at 4 workers
# (pool + caller), so -threads would add nothing measured.
JOB_ARGS="+cl_render_start_graph 2 +sv_querycache_job_graph 2 +portal_carve_job_graph 2 -vkemitparallel 1"

# Material quality. mat_dxlevel is not set here: the engine takes it from the
# renderer's caps (95 on native-vulkan, its maximum), and -dxlevel would also
# discard the saved video settings. These run after config.cfg, so they win
# over saved settings and dxsupport.cfg (which picks mat_picmip 0 here):
#   mat_bumpmap  1 = normal maps and bumped lightmaps
#   mat_picmip  -1 = every texture, bump maps included, at full resolution
#                    (0 keeps the lower resolution a VTF's LOD settings ask for)
#   r_lod        0 = every model at its highest LOD (dxsupport's level-95 pick;
#                    r_lod is not saved, so it would fall back to -1, by distance)
#   r_indirect_producer auto = the product profile's runtime GI order (sdf,
#                    radiosity, baked: the first the map offers); a capture's
#                    saved value would otherwise stick
MAT_ARGS="+mat_bumpmap 1 +mat_picmip -1 +r_lod 0 +r_indirect_producer auto"

# Extra args always appended to the command line (space separated).
# mat_queue_mode 2 = the queued material system: the render thread emits draws
# while the main thread builds the next frame (R32-QUEUED; about 3 ms off the
# frame median, 2026-09-25). It is archived, so a config.cfg saved while the
# launcher pinned 0 keeps 0 unless this passes 2. +mat_queue_mode 0 rolls back.
EXTRA_ARGS="-novid -insecure +mat_queue_mode 2"

# ---- Build / staging (advanced) -----------------------------------------
BUILD=1                    # 1 = `waf build` (incremental) before launch, 0 = skip
BUILD_DIR=build            # Waf output tree to boot from
RUNTIME=run/runtime        # staged, runnable tree (seeded once, re-overlaid each run)
# BASE_RUNTIME=            # runtime with Portal content; auto-detected if empty

# ---- Display environment -------------------------------------------------
SDL_VIDEODRIVER=wayland    # wayland | x11
