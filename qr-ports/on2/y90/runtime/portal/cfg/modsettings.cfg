//------------------------------------------------------------------------------
//
// Loaded by the engine on startup. If this file is not present in the mod's cfg
// folder, will not fallback based on search path.
//
// So hl2\cfg\modsettings.cfg will be exec'ed by HL2 but not Episode One or Two.
//
//------------------------------------------------------------------------------

// Tune bloomscale for all of Portal
mat_bloom_scalefactor_scalar .6


// Private RFC0003 native smoke settings; original runtime is unchanged.
r_threaded_particles 1
cl_threaded_bone_setup 1
r_threaded_renderables 1
sv_parallel_packentities 1
cl_localnetworkbackdoor 0
r_particle_job_graph 2
cl_bone_job_graph 2
r_renderable_job_graph 2
sv_packentities_job_graph 2
echo JOB_BATCH_NATIVE_2_BEGIN
r_threaded_particles
cl_threaded_bone_setup
r_threaded_renderables
sv_parallel_packentities
cl_localnetworkbackdoor
r_particle_job_graph
cl_bone_job_graph
r_renderable_job_graph
sv_packentities_job_graph
echo JOB_BATCH_NATIVE_2_END
